name: Lean build validation

on:
  pull_request:
    branches:
      - main
    paths:
      - Lean4ProofLiteracyLab.lean
      - lakefile.lean
      - lean-toolchain
      - .github/workflows/lean-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lake-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show pinned toolchain
        shell: bash
        run: cat lean-toolchain

      - name: Build frozen Lean project
        shell: bash
        run: lake build
